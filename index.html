const norm=s=>s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[أإآٱ]/g,'ا');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(){const n=norm(document.getElementById('q').value.trim());let last='',h='';
for(const r of DATA){if(n&&!norm(r.surah+' '+r.ayah+' '+r.word+' '+r.rule).includes(n))continue;
if(r.surah!==last){h+='<h2>'+esc(r.surah)+'</h2>';last=r.surah}
h+='<div class="c"><div class="r"><span class="w">'+esc(r.word)+'</span><span class="a">آية '+esc(r.ayah)+'</span></div><div class="t">'+esc(r.rule)+'</div></div>'}
document.getElementById('m').innerHTML=h||'<div class="e">لا توجد نتائج</div>'}
document.getElementById('q').addEventListener('input',render);render();document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
